{{- if .Values.llama_factory.enabled }}
{{- $ctx := . }}
{{- range .Values.llama_factory.models }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llama4-helm.fullname" $ctx }}
  labels:
    {{- include "llama4-helm.labels" $ctx | nindent 4 }}
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: {{ .service.port }}
      protocol: TCP
      nodePort: {{ .service.nodeport }}
      name: openai
  selector:
    {{- include "llama4-helm.selectorLabels" $ctx | nindent 4 }}
{{- end }}
{{- end }}