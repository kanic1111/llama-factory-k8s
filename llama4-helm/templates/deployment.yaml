{{- $ctx := . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llama4-helm.fullname" . }}
  labels:
    {{- include "llama4-helm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "llama4-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "llama4-helm.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llama4-helm.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        command: ["bash", "-c"]
        args:
          - | {{ include "llama_factory.renderBashCommand" .}}

        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: openai
            containerPort: {{ .Values.service.port }}
            protocol: TCP
      {{- if .Values.healthcheck.enabled }}
        {{- with .Values.healthcheck.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.healthcheck.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
      {{- if .Values.llama_factory.env }}
        env:
        {{- range $key, $val := .Values.llama_factory.env }}
          - name: {{ $key | upper | replace "-" "_" }}
            value: "{{ $val }}"
        {{- end }}
      {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        volumeMounts:
        {{- range .Values.volumeMounts }}
          {{- $volumeYaml := tpl (toYaml .  )  $ctx  }}
        - {{ $volumeYaml   |  nindent 10 | trim }}
        {{- end }}
   {{- if .Values.storage.volumes }}
      volumes:
      {{- range .Values.storage.volumes }}
        {{- $volumeYaml := tpl (toYaml .  )  $ctx  }}
        {{- if or (not (regexMatch ".*persistentVolumeClaim.*" $volumeYaml)) (and $.Values.storage.pvc.enabled (regexMatch ".*persistentVolumeClaim.*" $volumeYaml)) }}
      - {{ $volumeYaml   |  nindent 8 | trim }}
        {{- end }}
      {{- end }}
    {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

