kind: Deployment
apiVersion: apps/v1
metadata:
  name: vllm-gpt-oss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpt-oss
  template:
    metadata:
      name: gpt-oss
      labels:
        app: gpt-oss
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:gptoss
        command: ["bash", "-c"]
        args:
          - |
            vllm serve openai/gpt-oss-120b \
              --enforce-eager \
              --gpu-memory-utilization 0.9 \
               --max-model-len 32768
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - mountPath: /dev/shm
          name: dev-shm
        env:
        - name: NEMO_MODELS_CACHE
          value: "/workspace/.cache"
        - name: HF_HOME
          value: "/workspace/hf/cache"
        - name: HUGGINGFACE_HUB_CACHE
          value: "/workspace/hf/hub_cache"
        - name: API_PORT
          value: "8000"
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: "1"
        - name: "HF_TOKEN"
          value: ""
        resources:
          limits:
            nvidia.com/gpu: 1
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: llama-workspace
      - emptyDir:
          medium: "Memory"
          sizeLimit: "64Gi"
        name: dev-shm
      - name: llama4-config
        configMap:
          name: llama4-config
---
apiVersion: v1
kind: Service
metadata:
  name: llama4-nodeport
spec:
  type: NodePort
  selector:
    app: llama
  ports:
    - name: http
      protocol: TCP
      port: 8000         # Target port (your app's internal port)
      targetPort: 8000   # Pod containerPort
      nodePort: 30002
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-workspace
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: nfs-csi
